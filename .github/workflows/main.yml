name: Generate and Commit File

on:
  workflow_dispatch:
  schedule:
    - cron: '45 15 * * *'

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set variables
        run: |
          echo "update_version=$(date -u +'%Y-%m-%d' --date='8 hours')" >> ${GITHUB_ENV}
          echo "unix_timestamp=$(date +%s)" >> ${GITHUB_ENV}
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Golang
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependents
        run: |
          go install github.com/sagernet/sing-box/cmd/sing-box

      - name: Test
        run: go test -v ./...

      - name: Build sing-ruleset
        run: go build -o ./sing-ruleset-linux-amd64 ./main.go

      - name: Run
        run: |
          chmod +x ./sing-ruleset-linux-amd64
          ./sing-ruleset-linux-amd64 run --workdir . --output output --config config.json

      - name: Commit and Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./output/ || exit 1
          git init
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b output
          git add . && git commit -m "${update_version} - ${unix_timestamp}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin output
